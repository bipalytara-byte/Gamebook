<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>48 Jam Sebelum Deadline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5FB; --surface:#FFFFFF; --sunk:#E9ECF6; --ink:#1B1F3B; --muted:#5E6488; --line:#DCE0EE;
  --teal:#0F8B8D; --violet:#5B5BD6; --coral:#D1495B; --amber:#E9A23B; --gold:#C98F12;
  --on-accent:#FFFFFF; --chat:#DCF5D0; --misi:#FBEFD8;
  --accent:var(--teal);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12152B; --surface:#1C2040; --sunk:#252A50; --ink:#E8EAF6; --muted:#A3A8C8; --line:#2E3460;
    --teal:#3FB8B9; --violet:#8F8FF0; --coral:#F07383; --amber:#F2B95E; --gold:#F2C14E;
    --on-accent:#12152B; --chat:#23402A; --misi:#3A3020;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12152B; --surface:#1C2040; --sunk:#252A50; --ink:#E8EAF6; --muted:#A3A8C8; --line:#2E3460;
  --teal:#3FB8B9; --violet:#8F8FF0; --coral:#F07383; --amber:#F2B95E; --gold:#F2C14E;
  --on-accent:#12152B; --chat:#23402A; --misi:#3A3020;
  color-scheme: dark;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{ scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px); }
*,*::before,*::after{ box-sizing:inherit; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:"Atkinson Hyperlegible",Calibri,"Segoe UI",Arial,sans-serif; font-size:17px; line-height:1.55; -webkit-text-size-adjust:100%; }
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--surface); }
h1,h2,h3{ font-family:"Bricolage Grotesque","Arial Narrow",Arial,sans-serif; line-height:1.12; margin:0; letter-spacing:-0.01em; }
button{ font:inherit; }
:focus-visible{ outline:3px solid var(--amber); outline-offset:2px; }

/* HUD */
.hud{ position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--surface); border-bottom:1px solid var(--line); }
.hud-in{ max-width:720px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:14px; }
.hud .grp{ cursor:default; user-select:none; -webkit-user-select:none; font-weight:700; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:15px; }
.stat{ display:flex; flex-direction:column; align-items:flex-end; line-height:1.1; }
.stat b{ font-family:"Bricolage Grotesque",Arial,sans-serif; font-size:22px; font-weight:800; font-variant-numeric:tabular-nums; }
.stat span{ font-size:11px; color:var(--muted); }
.stat.red b{ color:var(--coral); }
.progress{ height:4px; background:var(--sunk); }
.progress i{ display:block; height:100%; background:var(--accent); transition:width .4s; }

main{ max-width:720px; margin:0 auto; padding:20px 16px 48px; }
.tags{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
.tag{ font-size:13px; font-weight:700; padding:3px 10px; border-radius:999px; background:var(--sunk); color:var(--ink); }
.tag.acc{ background:var(--accent); color:var(--on-accent); }
.title{ font-size:clamp(28px,7vw,40px); font-weight:800; margin-bottom:14px; }
.story{ margin:0 0 16px; }
.chat{ background:var(--chat); border-radius:4px 16px 16px 16px; padding:12px 14px; margin:0 0 18px; font-size:15px; }
.chat small{ display:block; font-weight:700; color:var(--teal); margin-bottom:4px; }
.sources{ list-style:none; padding:0; margin:0 0 18px; display:grid; gap:8px; }
.sources li{ display:flex; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:15px; }
.sources li b{ flex:0 0 28px; height:28px; border-radius:50%; background:var(--violet); color:var(--on-accent); display:grid; place-items:center; font-size:14px; }

/* misi */
.misi{ background:var(--misi); border-radius:14px; padding:14px; margin-bottom:18px; }
.misi label{ display:block; font-weight:700; margin-bottom:8px; }
.misi textarea{ width:100%; min-height:110px; border:1.5px solid var(--line); border-radius:10px; padding:10px; font:inherit; font-size:16px; background:var(--surface); color:var(--ink); resize:vertical; }
.misi .meta{ display:flex; justify-content:space-between; gap:10px; margin-top:6px; font-size:13px; color:var(--muted); }
.ok{ color:var(--teal); font-weight:700; }

.gate{ display:flex; flex-wrap:wrap; align-items:center; gap:12px; background:var(--surface); border:1px dashed var(--line); border-radius:12px; padding:12px 14px; margin-bottom:14px; font-size:15px; }
.skip{ flex:1 1 100%; padding:12px 14px; border:0; border-radius:10px; padding:10px 14px; background:var(--accent); color:var(--on-accent); font-weight:700; cursor:pointer; }
.clock{ font-family:"Bricolage Grotesque",Arial,sans-serif; font-size:26px; font-weight:800; font-variant-numeric:tabular-nums; min-width:76px; }

/* options */
.opts{ display:grid; gap:10px; }
.opt{ text-align:left; display:flex; gap:12px; align-items:flex-start; width:100%; background:var(--surface); color:var(--ink); border:2px solid var(--line); border-radius:14px; padding:14px; cursor:pointer; }
.opt .k{ flex:0 0 34px; height:34px; border-radius:50%; background:var(--accent); color:var(--on-accent); display:grid; place-items:center; font-weight:700; }
.opt[aria-pressed="true"]{ border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent); }
.opt:disabled{ cursor:not-allowed; opacity:.5; }
.cta{ display:block; width:100%; margin-top:14px; padding:15px; border:0; border-radius:14px; background:var(--ink); color:var(--bg); font-weight:700; font-size:17px; cursor:pointer; }
.cta:disabled{ opacity:.35; cursor:not-allowed; }
.cta.alt{ background:var(--sunk); color:var(--ink); }

/* outcome */
.delta{ display:flex; align-items:baseline; gap:12px; margin:4px 0 6px; }
.delta b{ font-family:"Bricolage Grotesque",Arial,sans-serif; font-size:72px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; }
.pos{ color:var(--teal); } .mid{ color:var(--gold); } .neg{ color:var(--coral); }
.note{ border-left:0; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px; margin:16px 0; }
.note strong{ display:block; font-size:13px; color:var(--muted); margin-bottom:4px; }
.warn{ background:var(--coral); color:var(--on-accent); border-radius:12px; padding:12px 14px; margin:12px 0; font-weight:700; }

/* chapter / intro / ending */
.hero{ padding:36px 0 12px; }
.hero .num{ font-family:"Bricolage Grotesque",Arial,sans-serif; font-size:clamp(90px,26vw,160px); font-weight:800; line-height:.85; color:var(--accent); }
.rules{ padding-left:20px; margin:12px 0 20px; }
.rules li{ margin-bottom:8px; }
.field{ display:block; margin:18px 0 6px; font-weight:700; }
input[type=text]{ width:100%; padding:12px; font:inherit; border:1.5px solid var(--line); border-radius:10px; background:var(--surface); color:var(--ink); }
.small{ font-size:14px; color:var(--muted); }
table{ width:100%; border-collapse:collapse; font-size:14px; }
.tw{ overflow-x:auto; margin:12px 0; }
th,td{ text-align:left; padding:8px; border-bottom:1px solid var(--line); vertical-align:top; }
th{ font-size:13px; color:var(--muted); }
.code{ font-family:"Bricolage Grotesque",Arial,sans-serif; font-size:20px; font-weight:800; letter-spacing:.04em; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px; word-break:break-all; }
textarea.dump{ width:100%; min-height:140px; font-size:13px; border:1px solid var(--line); border-radius:10px; background:var(--surface); color:var(--ink); padding:8px; }
.ending-badge{ display:inline-block; padding:4px 12px; border-radius:999px; font-weight:700; color:var(--on-accent); background:var(--accent); margin-bottom:12px; }

.enter{ animation:enter .35s ease-out; }
@keyframes enter{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:none; } }
@media (prefers-reduced-motion: reduce){ .enter{ animation:none; } .progress i{ transition:none; } }
</style>
</head>

<script>
const DATA = {"scenes":[{"id":"S1","ch":1,"no":"01","time":"Jumat · 19.10","icon":"FaUsb","title":"Berkas 0 KB dari Flash Disk Bayu","story":"Bayu menyerahkan flash disk berisi draf Latar Belakang yang ia ketik tiga hari. Di laptopmu, berkas Latar_Belakang.docx memang muncul, tapi ukurannya 0 KB dan gagal dibuka. Bayu mengaku tadi mencabut flash disk buru-buru karena dipanggil dosen wali. Grup kelompok mulai panik.","misi":"Masalah ini terjadi di lapis ke berapa (1–5)? Apa arti ukuran 0 KB?","materi":"P2","options":[{"key":"A","text":"Ganti ekstensinya jadi .txt atau buka paksa pakai aplikasi lain, siapa tahu isinya muncul.","pts":0,"next":"S2","oTitle":"Satu Jam Mengganti Label","oStory":"Kamu mengganti ekstensi tiga kali. Hasilnya tetap kosong, sekali malah muncul simbol acak. Satu jam terbuang sebelum Bayu akhirnya memeriksa laptopnya sendiri: berkas aslinya ternyata masih utuh di sana.","note":"Ekstensi hanya label petunjuk. Berkas 0 KB berarti byte isinya memang belum pernah tertulis, jadi tidak ada yang bisa \"dibuka paksa\"."},{"key":"B","text":"Cari \"aplikasi pemulih file gratis full version\" lalu unduh dari situs crack pertama yang muncul.","pts":-10,"next":"D1","oTitle":"Installer yang Minta Antivirus Dimatikan","oStory":"Installer 80 MB itu meminta antivirus dimatikan, dan kamu menurut. Berkas Bayu tetap tidak kembali. Sebaliknya, kipas laptopmu mulai menderu tanpa henti walau tidak ada aplikasi berat yang terbuka.","note":"Perangkat lunak bajakan lazim disisipi penambang kripto atau pencuri kata sandi. Lagi pula berkas 0 KB bukan berkas terhapus, jadi tidak ada yang bisa dipulihkan."},{"key":"C","text":"Jelaskan bahwa 0 KB berarti isinya belum tersalin. Minta Bayu membuka berkas asli di laptopnya dan mengunggahnya ke folder awan kelompok.","pts":10,"next":"S2","oTitle":"Berkas Asli Masih Utuh","oStory":"Bayu memeriksa laptopnya: berkas asli berukuran 245 KB masih utuh. Ia mengunggahnya ke folder awan kelompok, dan dua menit kemudian kamu sudah bisa membukanya. Kerja malam ini dimulai tanpa drama.","note":"Masalahnya di lapis 1 (data): flash disk dicabut sebelum penulisan selesai. Sumber aslinya masih ada, jadi langkah termurah adalah mengambil ulang."}]},{"id":"S2","ch":1,"no":"02","time":"Jumat · 20.30","icon":"FaRegFileAlt","title":"Tiga Format, Satu Tugas","story":"Pembagian tugas dimulai. Citra menulis di MacBook dengan aplikasi Pages, Bayu memakai Word, dan kamu sering mengetik di HP. Di folder kelompok sudah ada \"proposal fix.docx\", \"proposal fix banget.pages\", dan \"PROPOSAL REVISI 3 (1).docx\". Tidak ada yang tahu mana versi terbaru.","misi":"Tulis nama berkas yang benar untuk versi pertama laporan kalian (tanggal terbalik + nomor versi).","materi":"P2","options":[{"key":"A","text":"Pakai format .pages saja karena Citra yang paling rajin. Yang lain menyesuaikan.","pts":-5,"next":"S3","oTitle":"Terkunci di Satu Ekosistem","oStory":"Kamu dan Bayu tidak bisa membuka berkas .pages di Windows maupun Android. Setiap ada revisi, Citra harus mengekspor ulang lalu mengirimkannya satu per satu. Malam ini kalian hanya sempat menyelesaikan satu bab.","note":"Format tertutup hanya terjamin terbuka di aplikasi pemiliknya (vendor lock-in). Untuk kerja kelompok lintas perangkat, pilih format atau ruang kerja yang bisa diakses semua."},{"key":"B","text":"Satu dokumen daring bersama di akun kampus, penamaan 2026-10-16_MiniRiset_v01, lalu ekspor ke .pdf saat mengumpulkan.","pts":10,"next":"S3","oTitle":"Satu Dokumen, Riwayat Tercatat","oStory":"Semua orang mengedit di satu dokumen dari perangkat masing-masing. Riwayat versi tercatat otomatis, dan nama berkas langsung menunjukkan urutannya. Tidak ada lagi \"fix banget\" di folder kelompok.","note":"Ruang kerja yang bisa diakses semua perangkat ditambah penamaan berurutan (v01, v02) menghapus kebingungan versi. Format terbuka (.pdf) dipakai untuk mengumpulkan."},{"key":"C","text":"Masing-masing tetap di aplikasinya sendiri. Minggu malam nanti tinggal disalin-tempel jadi satu.","pts":0,"next":"S3","oTitle":"Bom Waktu untuk Minggu Malam","oStory":"Untuk sementara semua terasa lancar. Tapi kamu tahu Minggu malam nanti tiga format harus disatukan: tabel bisa bergeser, huruf beraksen bisa berubah jadi simbol aneh, dan tidak ada yang yakin versi mana yang dipakai.","note":"Menunda penyatuan berarti menumpuk risiko format dan encoding (mojibake) di menit terakhir, tepat saat waktu paling sempit."}]},{"id":"S3","ch":1,"no":"03","time":"Sabtu · 06.40","icon":"FaCommentDots","title":"Kiriman \"Asisten Dosen\"","story":"Grup angkatan menerima pesan dari nomor tak dikenal yang mengaku asisten dosen: \"Template laporan mini riset WAJIB dipakai, yang tidak memakai nilainya dipotong. Unduh: Template_MiniRiset.pdf\". Ukuran lampirannya 6,4 MB. Teman-teman sudah ramai mengunduhnya.","misi":"Sebutkan dua tanda bahaya dari lampiran ini (lihat ekstensi, ukuran, dan pengirimnya).","materi":"P2","options":[{"key":"A","text":"Langsung buka di HP saja. HP kan lebih aman daripada laptop.","pts":-10,"next":"D2","oTitle":"Izinkan Akses SMS?","oStory":"Berkas itu ternyata aplikasi. HP meminta izin \"Akses SMS & Notifikasi\" dan kamu menekan Izinkan. Sepuluh menit kemudian WhatsApp-mu keluar sendiri, dan nomor itu kini tidak bisa kamu pakai.","note":"Dokumen tidak pernah berbentuk .apk atau .exe. Ekstensi yang disembunyikan (Template.pdf.apk) adalah modus klasik pembajakan akun."},{"key":"B","text":"Cek detail berkasnya: ternyata Template_MiniRiset.pdf.apk. Jangan dibuka, peringatkan grup, dan konfirmasi ke dosen lewat LMS.","pts":10,"next":"S4","oTitle":"Satu Peringatan, Lima Akun Selamat","oStory":"Peringatanmu menyelamatkan setidaknya lima teman yang belum sempat membuka berkas. Satu jam kemudian dosen menegaskan di LMS bahwa tidak ada template wajib dan meminta semua mengabaikan pesan itu.","note":"Tampilkan ekstensi berkas, curigai ukuran yang tidak wajar untuk sebuah template, dan verifikasi lewat kanal resmi, bukan lewat nomor yang mengirimnya."},{"key":"C","text":"Tidak usah dibuka, tapi diam saja di grup. Bukan urusanku.","pts":3,"next":"S4","oTitle":"Kamu Aman, Teman Tidak","oStory":"Kamu selamat. Tapi siang itu dua teman sekelas kehilangan akun WhatsApp-nya, dan salah satunya anggota kelompok lain yang datanya dipakai untuk menipu orang tuanya.","note":"Menahan diri sudah benar. Literasi digital juga berarti melindungi orang lain dengan peringatan yang jelas dan disertai alasan."}]},{"id":"S4","ch":1,"no":"04","time":"Sabtu · 10.00","icon":"FaCloud","title":"Folder yang Lenyap","story":"Bayu \"merapikan\" laptopnya dan menghapus folder MiniRiset karena mengira itu salinan. Karena folder itu tersinkron, isinya ikut lenyap dari laptopmu dan HP Citra. Draf proposal dan catatan wawancara awal ada di dalamnya.","misi":"Jelaskan dalam satu kalimat beda menyimpan, menyinkronkan, dan mencadangkan.","materi":"P2","options":[{"key":"A","text":"Buka Sampah atau riwayat versi di layanan awan, pulihkan foldernya, lalu terapkan cadangan 3-2-1 mulai hari ini.","pts":10,"next":"S5","oTitle":"Pulih dalam Lima Menit","oStory":"Folder itu ternyata masih ada di Sampah layanan awan. Lima menit kemudian semuanya kembali. Kalian lalu menyepakati salinan ketiga: di awan, di laptop, dan di flash disk yang disimpan di rumah Citra.","note":"Sinkronisasi membuat semua perangkat kembar, termasuk saat menghapus. Hanya cadangan dan riwayat versi yang melindungi dari kesalahan sendiri."},{"key":"B","text":"Pakai salinan lama dari flash disk (versi Jumat) tanpa mengecek apa saja yang hilang.","pts":3,"next":"S5","oTitle":"Versi Jumat, Catatan Hilang","oStory":"Draf proposal kembali, tapi catatan wawancara awal tidak ada di flash disk. Kalian baru sadar sore harinya dan harus menghubungi ulang dua narasumber.","note":"Salinan lama lebih baik daripada tidak ada. Tetapi riwayat versi di layanan awan sering menyimpan versi terbaru yang belum sempat kalian cadangkan."},{"key":"C","text":"Marah-marah di grup, lalu mulai menulis ulang semuanya dari nol.","pts":-5,"next":"S5","oTitle":"Enam Jam Mengulang","oStory":"Bayu tersinggung, suasana kelompok memanas, dan kalian kehilangan enam jam untuk menulis ulang. Malamnya Citra menemukan bahwa folder itu sebenarnya masih ada di Sampah.","note":"Pelajari cara memulihkan versi lama sekarang, bukan saat panik. Mendiagnosis dulu hampir selalu lebih murah daripada mengulang."}]},{"id":"S5","ch":1,"no":"05","time":"Sabtu · 13.00","icon":"FaWifi","title":"Wi-Fi Penuh, Internet Nol","story":"Kamu harus membuka portal kampus dan mengunggah catatan, tapi di kos ikon Wi-Fi penuh sementara halaman tidak termuat dan WhatsApp tertahan. Teman kos bilang ada kafe depan kampus dengan Wi-Fi gratis tanpa kata sandi.","misi":"Tulis dua uji pembanding yang kamu lakukan untuk menemukan sumber masalah.","materi":"P2","options":[{"key":"A","text":"Pergi ke kafe, sambung ke Wi-Fi terbuka, lalu login portal akademik dan email kampus seperti biasa.","pts":-5,"next":"CH2","oTitle":"Kerja Jalan, Pintu Terbuka","oStory":"Pekerjaan memang jalan. Tapi di jaringan terbuka itu kamu login ke portal dan email tanpa memeriksa alamat situsnya. Dua hari kemudian ada percobaan masuk ke email kampusmu dari perangkat tak dikenal.","note":"Wi-Fi publik terbuka jauh lebih mudah diintip pihak lain di jaringan yang sama. Data seluler lebih aman untuk login akun penting."},{"key":"B","text":"Uji pembanding: coba situs lain, lalu cek HP dengan data seluler. Ternyata kuota Wi-Fi kos habis. Pakai tethering seluler dan kabari pemilik kos.","pts":10,"next":"CH2","oTitle":"Masalahnya Bukan di Laptop","oStory":"Semua situs gagal di Wi-Fi kos tetapi lancar di data seluler, jadi masalahnya di jalur keluar. Pemilik kos mengonfirmasi kuota habis. Kamu bekerja lewat tethering dan tidak kehilangan waktu.","note":"Wi-Fi hanya jalur ke router; sinyal penuh tidak berarti tersambung ke internet. Uji pembanding menunjukkan lapis mana yang bermasalah."},{"key":"C","text":"Restart laptop lima kali dan tunggu sampai internetnya \"sembuh sendiri\".","pts":0,"next":"CH2","oTitle":"Satu Setengah Jam Menunggu","oStory":"Laptop menyala dan mati lima kali, internet tetap tidak ada. Satu setengah jam kemudian pemilik kos mengirim pesan bahwa kuota Wi-Fi sudah diisi ulang. Kamu kehilangan waktu tanpa tahu penyebabnya.","note":"Mulai dari langkah termurah itu benar, tapi tanpa uji pembanding kamu tidak pernah tahu apakah masalahnya di perangkat, jaringan, atau layanan."}]},{"id":"S6","ch":2,"no":"06","time":"Sabtu · 15.00","icon":"FaFilter","title":"Dari Topik ke Pertanyaan","story":"Dosen hanya memberi topik: \"UMKM dan pembayaran digital\". Kelompok harus merumuskan satu pertanyaan riset yang bisa dijawab dalam dua hari, dengan wawancara di sekitar kampus. Tiga usulan muncul di grup.","misi":"Isi teknik corong kalian: Topik → Fokus → Siapa & Di mana → Pertanyaan.","materi":"P3","options":[{"key":"A","text":"\"Bagaimana perkembangan pembayaran digital di Indonesia?\"","pts":0,"next":"S7","oTitle":"Terlalu Luas untuk Dua Hari","oStory":"Pencarian pertama menghasilkan jutaan halaman dari berbagai sudut. Kalian bingung harus mewawancarai siapa, dan dosen pasti bertanya: apa yang bisa dijawab oleh kelompok mahasiswa dalam dua hari?","note":"Pertanyaan yang baik bisa dijawab, tidak terlalu luas, dan tidak terlalu sempit. Tambahkan siapa, di mana, dan kapan."},{"key":"B","text":"\"Apa alasan pemilik kedai kopi di sekitar kampus di Karanganyar belum memakai QRIS?\"","pts":10,"next":"S7","oTitle":"Jelas Siapa, Di Mana, dan Apa","oStory":"Pertanyaannya langsung memberi arah: siapa yang diwawancarai, di mana, dan kata kunci apa yang dicari. Kalian bisa membagi tugas dalam sepuluh menit.","note":"Teknik corong bekerja: topik umum dipersempit dengan fokus, pelaku, dan tempat, lalu diubah menjadi kalimat tanya yang bisa dijawab."},{"key":"C","text":"\"Bukti bahwa QRIS merugikan pedagang kecil\"","pts":-5,"next":"S7","oTitle":"Jawaban Sudah Ditulis Duluan","oStory":"Setiap hasil pencarian terasa \"membuktikan\" dugaan kalian, karena kata kuncinya memang mencari yang setuju. Pandangan pedagang yang puas dengan QRIS tidak pernah muncul di layar kalian.","note":"Memasukkan pendapat ke pertanyaan atau kata kunci adalah kesalahan paling berbahaya: mesin pencari hanya menunjukkan yang sejalan dengan kalian."}]},{"id":"S7","ch":2,"no":"07","time":"Sabtu · 16.30","icon":"FaKey","title":"Merakit Kata Kunci","story":"Saatnya mencari literatur. Bayu sudah mengetik sesuatu di kolom pencarian dan mendapat puluhan juta hasil, kebanyakan iklan aplikasi kasir. Kalian harus memilih rumusan pencarian mana yang dipakai kelompok.","misi":"Tulis kata kunci versi Indonesia, versi Inggris, dan satu sinonim yang akan kalian pakai.","materi":"P3","options":[{"key":"A","text":"kenapa ya umkm ga mau pake qris padahal gampang bgt","pts":0,"next":"S8","oTitle":"Hasilnya Ikut Curhat","oStory":"Yang muncul adalah utas forum, video reaksi, dan artikel \"tips jualan\". Tidak satu pun bisa dikutip di laporan. Bayu menggulir sampai halaman lima tanpa hasil yang berguna.","note":"Kata kunci yang baik berisi 3–6 kata penting, memakai istilah baku, tanpa kata sambung, singkatan, dan bahasa curhat."},{"key":"B","text":"\"adopsi QRIS\" UMKM kendala, ditambah versi Inggris: \"QRIS adoption\" MSME barriers","pts":10,"next":"S8","oTitle":"Dari Jutaan ke Puluhan","oStory":"Tanda kutip mengunci frasa, istilah baku memanggil artikel ilmiah, dan versi Inggris membuka jurnal internasional. Hasilnya tinggal puluhan, dan sebagian besar relevan.","note":"Coret kata tak penting, ganti dengan istilah baku, siapkan sinonim dan versi bahasa Inggris, lalu kunci frasa dengan tanda kutip."},{"key":"C","text":"QRIS UMKM site:go.id","pts":5,"next":"S8","oTitle":"Resmi, tapi Belum Akademik","oStory":"Kalian menemukan aturan dan data resmi dari situs pemerintah. Berguna untuk latar belakang, tapi belum ada satu pun penelitian tentang alasan pedagang menolak atau menerima QRIS.","note":"site:go.id tepat untuk informasi resmi. Untuk kebutuhan akademik, tambahkan pencarian di Google Scholar atau Garuda."}]},{"id":"S8","ch":2,"no":"08","time":"Sabtu · 19.00","icon":"FaRobot","title":"Lima Jurnal dari Chatbot","story":"Citra meminta chatbot AI: \"berikan 5 jurnal tentang adopsi QRIS di UMKM\". Dalam lima detik muncul lima judul lengkap dengan penulis, tahun, dan nama jurnal. Semuanya terdengar sangat meyakinkan. Bayu: \"Langsung masukin dapus aja, beres!\"","misi":"Tulis langkah memverifikasi satu rujukan dari AI: dicari di mana, dan apa saja yang dicek?","materi":"P3","options":[{"key":"A","text":"Masukkan kelima rujukan itu ke daftar pustaka. AI kan pintar, dan waktunya mepet.","pts":-10,"next":"D3","oTitle":"Daftar Pustaka yang Rapi Sekali","oStory":"Daftar pustaka kalian kini terlihat sangat profesional. Masalahnya, tidak ada satu pun anggota kelompok yang pernah membuka artikel-artikel itu.","note":"Chatbot menyusun jawaban dari pola bahasa dan bisa mengarang judul jurnal yang tidak pernah ada. Setiap rujukan wajib dicari ulang."},{"key":"B","text":"Lupakan AI. Ambil saja hasil pertama Google: artikel \"7 Alasan UMKM Wajib Pakai QRIS\".","pts":0,"next":"S9","oTitle":"Hasil Pertama Bertanda Bersponsor","oStory":"Artikel itu ternyata ditulis penyedia aplikasi kasir dan penuh tautan pendaftaran. Isinya rapi, tapi tujuannya menjual. Kalian harus mencari ulang malam ini.","note":"Hasil teratas bisa dibeli (iklan) atau dioptimasi SEO. Untuk tugas kuliah, artikel blog bukan rujukan akademik."},{"key":"C","text":"Pakai AI untuk ide sinonim, lalu cari tiap judul di Google Scholar dan Garuda. Simpan yang benar-benar ada, dan deklarasikan penggunaan AI.","pts":10,"next":"S9","oTitle":"Tiga dari Lima Tidak Pernah Ada","oStory":"Tiga judul tidak ditemukan di mana pun. Dua sisanya ada, tetapi tahun terbitnya berbeda dari yang disebut AI. Kalian menyimpan dua artikel asli itu dan menambahkan satu baris deklarasi AI di laporan.","note":"AI berguna untuk memikirkan kata kunci, bukan sebagai sumber. Kalau rujukan tidak ketemu di Scholar atau Garuda, anggap rujukan itu tidak ada."}]},{"id":"S9","ch":2,"no":"09","time":"Sabtu · 20.30","icon":"FaLock","title":"Jurnal yang Terkunci","story":"Kamu menemukan artikel internasional yang sangat pas dengan pertanyaan kalian, tapi teks lengkapnya berbayar 35 dolar. Di grup angkatan ada yang membagikan situs \"unduh jurnal gratis semua penerbit\" yang penuh iklan pop-up.","misi":"Sebutkan dua cara sah untuk mendapatkan teks lengkap atau alternatif yang setara.","materi":"P3","options":[{"key":"A","text":"Pakai situs unduh itu. Toh semua orang juga begitu.","pts":-5,"next":"S10","oTitle":"PDF Didapat, Peramban Disusupi","oStory":"PDF-nya memang terunduh. Tapi sejak itu peramban kamu dipenuhi notifikasi iklan aneh dan halaman pencarian berubah sendiri. Butuh satu jam untuk membersihkannya.","note":"Situs pengunduh jurnal bajakan melanggar hak cipta dan rawan malware. Ada jalan sah yang sering terlupakan."},{"key":"B","text":"Kutip isinya hanya dari abstrak, ditulis seolah sudah membaca seluruh artikel.","pts":0,"next":"S10","oTitle":"Mengutip yang Tidak Dibaca","oStory":"Laporan terlihat lengkap, tapi kalimat kalian tentang metode dan angka hasil penelitian ternyata hanya tebakan dari abstrak. Kalau dosen bertanya detail, tidak ada yang bisa menjawab.","note":"Abstrak dipakai untuk memutuskan apakah artikel layak dibaca, bukan pengganti isi. Mengutip yang tidak dibaca berisiko salah kutip."},{"key":"C","text":"Cari tautan [PDF] di Google Scholar, cek repositori kampus penulis dan DOAJ. Ternyata ada versi akses terbuka yang sah.","pts":10,"next":"S10","oTitle":"Versi Sah di Repositori Penulis","oStory":"Di sebelah kanan hasil Google Scholar ada tautan [PDF] ke repositori kampus penulisnya. Isinya sama dengan versi terbitan. Gratis, legal, dan aman.","note":"Banyak penulis mengunggah salinan karyanya di repositori kampus. DOAJ dan Garuda juga berisi jurnal akses terbuka."}]},{"id":"S10","ch":2,"no":"10","time":"Sabtu · 21.30","icon":"FaBookOpen","special":"sources","title":"Pilih Tiga dari Enam Sumber","story":"Dosen meminta minimal tiga rujukan yang bisa dipertanggungjawabkan. Baca judul, tahun, dan asal tiap sumber (aturan 3 menit), lalu pilih paket yang dipakai.","misi":"Tulis satu kalimat alasan untuk tiap sumber yang kalian pilih.","sources":[{"n":"1","t":"Jurnal nasional terindeks SINTA, 2024 — \"Faktor Penghambat Adopsi QRIS pada UMKM Kuliner\" — ada PDF"},{"n":"2","t":"Blog \"Tips Bisnis Anak Muda\", tanpa tanggal — \"QRIS Bikin Untung Berlipat!\" — penuh tautan afiliasi"},{"n":"3","t":"Laporan resmi bank sentral (.go.id), 2025 — data jumlah merchant QRIS nasional"},{"n":"4","t":"Jurnal internasional akses terbuka (DOAJ), 2023 — adopsi pembayaran QR oleh pedagang kecil"},{"n":"5","t":"Skripsi di repositori kampus, 2016 — mesin EDC kartu debit di minimarket"},{"n":"6","t":"Video TikTok \"pedagang curhat QRIS\", 1,2 juta tayangan, akun tanpa nama asli"}],"materi":"P3","options":[{"key":"A","text":"Sumber 1, 3, dan 4","pts":10,"next":"CH3","oTitle":"Tiga Rujukan yang Saling Menguatkan","oStory":"Satu jurnal nasional terbaru tentang topik yang persis sama, satu data resmi untuk konteks, dan satu jurnal internasional akses terbuka sebagai pembanding. Dosen tidak akan kesulitan menelusuri ketiganya.","note":"Cek judul (relevan?), tahun (5 tahun terakhir untuk topik teknologi), nama jurnal atau lembaga, lalu abstraknya."},{"key":"B","text":"Sumber 1, 5, dan 6","pts":3,"next":"CH3","oTitle":"Satu Kuat, Dua Rapuh","oStory":"Sumber 1 sangat pas. Tapi skripsi 2016 membahas mesin EDC, bukan QRIS, dan video TikTok tanpa nama asli tidak bisa dipertanggungjawabkan. Dua rujukan harus diganti sebelum Senin.","note":"Repositori bagus untuk contoh penelitian, tetapi tahun dan relevansinya tetap dicek. Video boleh jadi pintu masuk, bukan rujukan."},{"key":"C","text":"Sumber 2, 3, dan 6","pts":0,"next":"CH3","oTitle":"Ramai Belum Tentu Sah","oStory":"Hanya laporan bank sentral yang bisa dipakai. Blog afiliasi bertujuan menjual, dan video viral tidak jelas pembuatnya. Laporan kalian kini nyaris tanpa dasar penelitian.","note":"Popularitas bukan ukuran kredibilitas. Jurnal yang melewati peer review tetap rujukan utama tugas kuliah."}]},{"id":"S11","ch":3,"no":"11","time":"Minggu · 09.00","icon":"FaBullhorn","special":"message","title":"Pesan Berantai di Kedai Kopi","story":"Kalian mewawancarai Mbak Sri, pemilik kedai \"Kopi Pojok\" (fiktif). Ia menyodorkan HP-nya: \"Mbak, ini bener nggak? Kalau bener saya mau berhenti pakai QRIS.\"","msg":"‼️PENTING‼️ MULAI 1 NOVEMBER SEMUA PEDAGANG PAKAI QRIS WAJIB SETOR PAJAK 10% DARI OMZET, YANG TELAT REKENING DIBLOKIR!!! Info orang dalam bank. SEBARKAN sebelum dihapus 🙏","msgFrom":"Paguyuban Pedagang · diteruskan berkali-kali","misi":"Beri skor CRAAP pesan ini (C-R-A-A-P, masing-masing 0–2) dan tulis totalnya.","materi":"P4","options":[{"key":"A","text":"\"Iya Mbak, saya juga dengar.\" Lalu kamu mencatat \"takut pajak QRIS\" sebagai temuan utama riset.","pts":-10,"next":"D4","oTitle":"Temuan Utama dari Pesan Berantai","oStory":"Mbak Sri mengangguk cemas dan langsung mematikan kode QRIS di mejanya. Di catatanmu, \"takut pajak QRIS\" kini menjadi temuan nomor satu.","note":"Pesan ini menekan empat tombol hoaks sekaligus: emosi, desakan waktu, \"orang dalam\", dan perintah menyebarkan."},{"key":"B","text":"\"Itu pasti hoaks, Mbak,\" tanpa mengecek apa pun.","pts":3,"next":"S12","oTitle":"Benar, tapi Tanpa Bukti","oStory":"Tebakanmu kebetulan benar. Tapi kamu tidak bisa menunjukkan apa pun, dan Mbak Sri lebih percaya grup paguyubannya. Ia tetap ragu dan berencana \"lihat-lihat dulu\" sebelum memakai QRIS lagi.","note":"Menebak benar tidak sama dengan memverifikasi. Bukti yang bisa ditunjukkan jauh lebih meyakinkan daripada keyakinan."},{"key":"C","text":"Stop dulu. Buka tab baru: cari inti klaim + \"hoaks\" di situs cek fakta, cek pengumuman di situs resmi (.go.id), lalu tunjukkan hasilnya ke Mbak Sri.","pts":10,"next":"S12","oTitle":"Membaca ke Samping","oStory":"Tidak ada pengumuman semacam itu di situs resmi mana pun, dan situs cek fakta sudah pernah membahas pola pesan serupa. Mbak Sri lega. Kalian mencatat temuan baru: sebagian keraguan pedagang ternyata dipicu pesan berantai.","note":"SIFT: Stop, Investigate, Find, Trace. Skor CRAAP pesan ini sekitar 2/10: jangan dipakai, jangan dibagikan."}]},{"id":"S12","ch":3,"no":"12","time":"Minggu · 13.00","icon":"FaImage","title":"Foto Kedai Tutup Massal","story":"Di grup angkatan beredar foto deretan kedai tutup dengan keterangan: \"HARI INI kedai-kedai di Karanganyar tutup massal karena QRIS error!!\" Bayu langsung menyimpannya: \"Pas banget buat slide pembuka presentasi kita!\"","misi":"Tulis empat langkah reverse image search dan satu detail di foto yang bisa jadi petunjuk lokasi atau waktu.","materi":"P4","options":[{"key":"A","text":"Lacak asal foto di dua mesin (Google Lens dan TinEye/Bing), cari unggahan paling awal, lalu bandingkan ceritanya.","pts":10,"next":"S13","oTitle":"Foto Asli, Cerita Palsu","oStory":"Unggahan tertua ditemukan: tahun 2023, di kota lain, saat kedai-kedai tutup karena libur Lebaran. Papan nama toko di foto pun memakai nama jalan yang tidak ada di Karanganyar. Foto itu tidak dipakai.","note":"Konteks palsu adalah hoaks yang paling sulit dikenali: fotonya asli, tetapi waktu dan tempatnya salah."},{"key":"B","text":"Pakai di slide dengan keterangan \"Sumber: grup WA angkatan\".","pts":-5,"next":"S13","oTitle":"Sumber: Grup WA","oStory":"Slide pembuka kalian jadi dramatis. Tapi \"grup WA angkatan\" bukan sumber yang bisa ditelusuri, dan kalian sendiri tidak tahu kapan serta di mana foto itu diambil.","note":"Mencantumkan tempat menemukan bukan berarti mencantumkan sumber asli. Telusuri dulu ke asalnya (Trace)."},{"key":"C","text":"Pakai, tapi crop bagian papan nama toko dan watermark supaya tidak kelihatan kotanya.","pts":-10,"next":"S13","oTitle":"Dari Penerima Jadi Pembuat","oStory":"Foto yang sudah dipotong itu kini terlihat seperti terjadi di mana saja. Tanpa sadar, kelompok kalian baru saja menambah satu lapis manipulasi pada hoaks yang beredar.","note":"Menghapus petunjuk agar kesannya berubah adalah manipulasi. Kalian berpindah dari penyebar misinformasi menjadi pembuat disinformasi."}]},{"id":"S13","ch":3,"no":"13","time":"Minggu · 15.00","icon":"FaUserSecret","title":"Tangkapan Layar yang \"Lucu\"","story":"Teman sekelas yang ikut membantu wawancara mengunggah tangkapan layar chat pribadi Mbak Sri ke grup angkatan. Di situ Mbak Sri bercerita omzetnya turun dan cicilannya menumpuk. Keterangannya: \"Pantes nggak mau QRIS, duitnya aja nggak ada 🤣\". Grup ramai stiker tertawa.","misi":"Ini misinformasi, disinformasi, atau malinformasi? Tulis dua alasannya.","materi":"P4","options":[{"key":"A","text":"Ikut kirim stiker. Toh isinya fakta, bukan hoaks.","pts":-10,"next":"S14","oTitle":"Fakta yang Dipakai untuk Menyakiti","oStory":"Tangkapan layar itu menyebar ke dua grup lain. Sore harinya Mbak Sri menelepon dengan suara bergetar dan meminta semua jawabannya di wawancara tidak dipakai.","note":"Malinformasi: isinya benar, tetapi disebar untuk mempermalukan. Data narasumber juga dilindungi UU Pelindungan Data Pribadi."},{"key":"B","text":"Diam saja dan keluar dari grup supaya tidak ikut terlibat.","pts":0,"next":"S14","oTitle":"Tidak Ikut, tapi Tidak Menghentikan","oStory":"Kamu tidak ikut menertawakan, tapi tangkapan layar itu tetap beredar. Tidak ada yang mengingatkan, dan Mbak Sri masih belum tahu chatnya tersebar.","note":"Tidak menyebarkan sudah benar. Tetapi sebagai pihak yang mengumpulkan data, kelompok kalian ikut bertanggung jawab menjaga narasumber."},{"key":"C","text":"Minta unggahan dihapus, jelaskan itu malinformasi dan melanggar privasi narasumber. Di laporan, nama narasumber disamarkan.","pts":10,"next":"S14","oTitle":"Narasumber Terlindungi","oStory":"Unggahan dihapus setelah kamu menjelaskan alasannya dengan tenang. Di laporan, Mbak Sri ditulis sebagai \"Pemilik Kedai A\". Ia tetap bersedia membantu kalian sampai akhir.","note":"Dua pertanyaan pembeda: isinya benar atau salah? Ada niat merugikan atau tidak? Benar + niat merugikan = malinformasi."}]},{"id":"S14","ch":3,"no":"14","time":"Minggu · 17.00","icon":"FaChartBar","title":"Survei 95 Persen","story":"Untuk melengkapi data, kelompok menyebar survei daring \"Seberapa setuju QRIS memudahkan UMKM?\" lewat Instagram Story Citra. Ada 60 responden, 95% sangat setuju. Hampir semuanya teman Citra di komunitas startup kampus. Bayu: \"Mantap! Kesimpulan: UMKM sudah siap QRIS!\"","misi":"Siapa yang suaranya tidak terdengar di survei ini? Tulis dua kelompok responden yang perlu ditambahkan.","materi":"P4","options":[{"key":"A","text":"Pakai angka 95% itu sebagai kesimpulan utama laporan.","pts":-5,"next":"S15","oTitle":"Kesimpulan dari Ruang Gema","oStory":"Grafiknya meyakinkan. Tapi pertanyaan riset kalian tentang pemilik kedai, sementara respondennya mahasiswa yang sepakat satu sama lain. Hasil wawancara langsung justru bercerita lain.","note":"Echo chamber: kelompok yang sepakat saling menggemakan suara. Keputusan yang hanya mendengar yang setuju bisa keliru."},{"key":"B","text":"Hapus tiga jawaban yang tidak setuju supaya grafiknya rapi 100%.","pts":-10,"next":"S15","oTitle":"Data yang Dibersihkan dari Kenyataan","oStory":"Grafik kalian kini sempurna, dan sepenuhnya menyesatkan. Kalian juga tidak bisa lagi menjelaskan berapa sebenarnya jumlah responden yang tidak setuju.","note":"Membuang data yang tidak sesuai harapan adalah manipulasi data, pelanggaran integritas akademik yang serius."},{"key":"C","text":"Akui ini gema kelompok sendiri. Tambahkan data dari pemilik kedai yang diwawancarai langsung, dan tulis keterbatasan sampelnya.","pts":10,"next":"S15","oTitle":"Melubangi Gelembung","oStory":"Data wawancara delapan pemilik kedai menunjukkan gambaran berbeda: QRIS dianggap memudahkan, tetapi ada kekhawatiran soal biaya dan kabar burung. Laporan kalian kini jujur tentang batas datanya.", const ALL = {};
DATA.scenes.forEach(s => ALL[s.id] = s);
DATA.detours.forEach(d => { const host = ALL[d.after]; ALL[d.id] = { ...d, ch: host.ch, red: true }; });

let S = load() || fresh();
let tick = null;

function fresh(){ return { v:1, screen:"intro", group:"", startAt:0, cur:null, ch:1, log:[], score:0, red:0, enterAt:0, draft:{}, pick:null, last:null, test:false }; }
function load(){ try{ const t = localStorage.getItem(KEY); return t ? JSON.parse(t) : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function now(){ return Date.now(); }
function esc(t){ return String(t).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmt(sec){ sec = Math.max(0, Math.round(sec)); return Math.floor(sec/60) + ":" + String(sec%60).padStart(2,"0"); }
function sgn(n){ return n > 0 ? "+" + n : n < 0 ? "−" + Math.abs(n) : "0"; }
function cls(n){ return n >= 10 ? "pos" : n >= 0 ? "mid" : "neg"; }
function waitFor(id){ if (S.test) return 0; const s = ALL[id]; return s.red ? DETOUR_SEC : LONG.includes(id) ? LONG_SEC : SCENE_SEC; }
function setAccent(c){ document.documentElement.style.setProperty("--accent", c); }

function go(screen, extra){ Object.assign(S, extra || {}, { screen, enterAt: now() }); save(); render(); window.scrollTo(0,0); }

function hud(){
  const on = S.screen !== "intro";
  document.getElementById("hud").hidden = !on;
  if (!on) return;
  document.getElementById("hudGroup").textContent = S.group;
  document.getElementById("hudScore").textContent = S.score;
  document.getElementById("hudRed").textContent = S.red;
  const done = S.log.filter(l => !ALL[l.id].red).length;
  document.getElementById("hudProg").style.width = Math.round(done / 15 * 100) + "%";
  const left = TOTAL_SEC - (now() - S.startAt) / 1000;
  document.getElementById("hudTime").textContent = left >= 0 ? fmt(left) : "+" + fmt(-left);
}

function render(){
  clearInterval(tick);
  const app = document.getElementById("app");
  hud();
  if (S.screen === "intro") return intro(app);
  if (S.screen === "chapter") return chapter(app);
  if (S.screen === "scene") return scene(app);
  if (S.screen === "outcome") return outcome(app);
  if (S.screen === "ending") return ending(app);
}

  const misiOk = () => ta.value.replace(/\s+/g, " ").trim().length >= MISI_MIN;
  const update = () => {
    const n = ta.value.replace(/\s+/g, " ").trim().length;
    cnt.innerHTML = n >= MISI_MIN ? `<span class="ok">Misi terisi (${n} karakter)</span>` : `${n}/${MISI_MIN} karakter minimal`;
    const left = waitFor(s.id) - (now() - S.enterAt) / 1000;
    const skipped = !!(S.skipped && S.skipped[s.id]);
    const timeOk = left <= 0 || skipped;
    skipBtn.hidden = timeOk || !misiOk();
    app.querySelector("#clock").textContent = skipped && left > 0 ? "Siap" : timeOk ? "0:00" : fmt(left);
    app.querySelector("#gateTxt").textContent = timeOk
      ? (misiOk() ? "Pilihan terbuka. Diskusikan, lalu kunci satu jawaban." : "Waktu diskusi selesai. Lengkapi misi untuk membuka pilihan.")
      : (misiOk() ? "Misi sudah terisi. Kalau kelompok sudah sepakat, kalian boleh langsung menjawab." : "Waktu diskusi. Baca kasusnya dan kerjakan misi bersama kelompok.");
    const open = timeOk && misiOk();
    opts.forEach(b => b.disabled = !open);
    lock.disabled = !(open && S.pick);
    lock.textContent = S.pick ? `Kunci pilihan ${S.pick}` : "Pilih salah satu dulu";
    hud();
  };
  ta.addEventListener("input", () => { S.draft[s.id] = ta.value; save(); update(); });
  opts.forEach(b => b.addEventListener("click", () => {
    S.pick = b.dataset.k; save();
    opts.forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
    update();
  }));
  if (S.pick) opts.forEach(x => x.setAttribute("aria-pressed", x.dataset.k === S.pick ? "true" : "false"));
  lock.addEventListener("click", () => {
    const o = s.options.find(x => x.key === S.pick);
    if (!o || !misiOk()) return;
    if (!confirm(`Kunci pilihan ${o.key}? Pilihan tidak bisa diubah.`)) return;
    S.log.push({ id: s.id, key: o.key, pts: o.pts, misi: ta.value.trim(), red: !!s.red, at: Math.round((now() - S.startAt)/1000), skip: (S.skipped && S.skipped[s.id]) || 0 });
    S.score += o.pts;
    if (o.next.startsWith("D")) S.red += 1;
    go("outcome", { last: { id: s.id, key: o.key }, pick: null });
  });
  update();
  tick = setInterval(update, 1000);
}

/* ---------- OUTCOME ---------- */
function outcome(app){
  const s = ALL[S.last.id], o = s.options.find(x => x.key === S.last.key);
  setAccent(s.red ? "var(--coral)" : CH[s.ch].color);
  const toRed = o.next.startsWith("D");
  const label = o.next === "HITUNG" ? "Lihat ending" : o.next.startsWith("CH") ? "Lanjut ke bab berikutnya" : toRed ? "Masuk Jalur Merah" : "Lanjut ke scene berikutnya";
  app.innerHTML = `
  <section class="enter">
    <div class="tags"><span class="tag acc">${s.red ? "Jalur Merah" : "Scene " + s.no}, pilihan ${o.key}</span></div>
    <div class="delta"><b class="${cls(o.pts)}" id="dv">${sgn(o.pts)}</b><span>poin literasi</span></div>
    <h1 class="title">${esc(o.oTitle)}</h1>
    <p class="story">${esc(o.oStory)}</p>
    ${toRed ? `<div class="warn">Pilihan ini membawa kalian ke Jalur Merah. Satu Jejak Merah tercatat.</div>` : ""}
    <div class="note"><strong>Catatan literasi · ${esc(MATERI[s.materi])}</strong>${esc(o.note)}</div>
    <button class="cta" id="next" disabled></button>
  </section>`;
  const btn = app.querySelector("#next");
  const update = () => {
    const left = (S.test ? 0 : OUTCOME_SEC) - (now() - S.enterAt) / 1000;
    btn.disabled = left > 0;
    btn.textContent = left > 0 ? `Baca catatannya dulu (${Math.ceil(left)} dtk)` : label;
    hud();
  };
  btn.addEventListener("click", () => {
    if (o.next === "HITUNG") return go("ending");
    if (o.next.startsWith("CH")) return go("chapter", { ch: Number(o.next.slice(2)) });
    go("scene", { cur: o.next, pick: null });
  });
  update(); tick = setInterval(update, 1000);
}

/* ---------- ENDING ---------- */
function endingKey(){ if (S.score >= 130 && S.red === 0) return "true"; if (S.score >= 80) return "good"; return "bad"; }
function code(){
  const path = S.log.map(l => (ALL[l.id].red ? l.id : l.id.slice(1)) + l.key).join("-");
  let h = 7; const str = S.group + "|" + path + "|" + S.score + "|" + S.red;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 9973;
  return { path, check: String(h).padStart(4, "0") };
}
function ending(app){
  const k = endingKey(), E = ENDINGS[k]; setAccent(E.color);
  const dur = Math.round(((S.endAt || (S.endAt = now(), save(), S.endAt)) - S.startAt) / 60000);
  const c = code();
  const rows = S.log.map(l => { const s = ALL[l.id]; return `<tr><td>${s.red ? "⚠ " + esc(l.id) : esc(s.no)}</td><td>${esc(l.key)}</td><td class="${cls(l.pts)}"><b>${sgn(l.pts)}</b></td><td>${esc(l.misi)}${l.skip ? `<br><span class="small">Lewati waktu (sisa ${fmt(l.skip)})</span>` : ""}</td></tr>`; }).join("");
  const text = [
    `GAMEBOOK 48 JAM — ${S.group}`,
    `Ending: ${E.label.toUpperCase()} (${E.title})`,
    `Skor: ${S.score} · Jejak Merah: ${S.red} · Durasi: ${dur} menit`,
    `Jalur: ${c.path}`, `Kode cek: ${c.check}`, ``,
    ...S.log.map(l => `${ALL[l.id].red ? l.id : "S" + ALL[l.id].no} ${l.key} (${sgn(l.pts)})${l.skip ? " [lewati " + fmt(l.skip) + "]" : ""} — Misi: ${l.misi.replace(/\s+/g, " ")}`)
  ].join("\n");
  app.innerHTML = `
  <section class="hero enter">
    <span class="ending-badge">${E.label}</span>
    <h1 class="title">${esc(E.title)}</h1>
    <p class="story">${esc(E.story)}</p>
    <div class="note"><strong>Pelajaran kunci</strong>${esc(E.key)}</div>
    <div class="delta"><b class="${S.score >= 130 ? "pos" : S.score >= 80 ? "mid" : "neg"}">${S.score}</b><span>poin dari 150 · ${S.red} Jejak Merah · ${dur} menit</span></div>
    <h2 style="font-size:22px;margin-top:24px">Kode untuk dosen</h2>
    <div class="code">${esc(c.path)}<br>Cek ${c.check}</div>
    <h2 style="font-size:22px;margin-top:24px">Lembar jejak</h2>
    <div class="tw"><table><thead><tr><th>Scene</th><th>Pilih</th><th>Poin</th><th>Jawaban misi</th></tr></thead><tbody>${rows}</tbody></table></div>
    <h2 style="font-size:22px;margin-top:24px">Kirim rekap</h2>
    <p class="small">Salin teks ini lalu tempel ke LMS atau grup kelas sesuai arahan dosen. Bisa juga screenshot halaman ini.</p>
    <textarea class="dump" id="dump" readonly>${esc(text)}</textarea>
    <button class="cta" id="copy">Salin rekap</button>
    <h2 style="font-size:22px;margin-top:28px">Refleksi kelompok</h2>
    <ol class="rules">
      <li>Pilihan mana yang paling mengubah arah cerita kalian?</li>
      <li>Berapa jam cerita habis untuk memperbaiki kesalahan yang sebenarnya bisa dicegah?</li>
      <li>Kejadian mana yang pernah benar-benar kalian alami? Apa yang akan kalian lakukan berbeda?</li>
    </ol>
    <button class="cta alt" id="reset">Main ulang dari awal</button>
  </section>`;
  app.querySelector("#copy").addEventListener("click", async (e) => {
    const ta = app.querySelector("#dump");
    try { await navigator.clipboard.writeText(ta.value); e.target.textContent = "Rekap tersalin"; }
    catch(err){ ta.focus(); ta.select(); e.target.textContent = "Teks sudah diblok, salin manual"; }
  });
  app.querySelector("#reset").addEventListener("click", () => {
    if (!confirm("Mulai ulang? Semua jejak dan rekap di HP ini akan dihapus.")) return;
    const g = S.group; S = fresh(); S.group = g; save(); render();
  });
}

let hudTaps = 0, hudTimer = null;
document.getElementById("hudGroup").addEventListener("click", () => {
  hudTaps++; clearTimeout(hudTimer); hudTimer = setTimeout(() => hudTaps = 0, 2500);
  if (hudTaps < 5) return;
  hudTaps = 0;
  const c = (prompt("Menu dosen. Ketik RESET75 untuk mengulang dari awal, atau UJI75 untuk mematikan timer:") || "").trim().toUpperCase();
  if (c === "RESET75"){
    if (!confirm("Reset game di perangkat ini? Skor, jejak, dan jawaban misi akan dihapus.")) return;
    const keepTest = S.test; S = fresh(); S.test = keepTest; save(); render(); window.scrollTo(0,0);
  } else if (c === "UJI75"){
    S.test = !S.test; save(); render(); alert(S.test ? "Mode uji aktif: timer dimatikan." : "Mode uji dimatikan: timer berjalan lagi.");
  } else if (c){ alert("Kode tidak dikenal."); }
});
render();
document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });
</script>
</body>
